<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunkify Uploader Test</title>
    <style>
        body { font: 16px system-ui; padding: 24px; }
        chunkify-uploader { max-width: 480px; margin: 0 auto; padding: 24px; border: 2px dashed #ccc; gap: 16px; text-align: center; }
        chunkify-uploader-file-select, chunkify-uploader-retry { padding: 12px; background: #def; border-radius: 8px; }
        chunkify-uploader-error { color: #a00; }
        #logs { white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <p>Serve this file after building the package. Configure your backend at /api/uploads to return an upload session.</p>
    <chunkify-uploader max-file-size="300" drop>
        <chunkify-uploader-heading>Upload a video or audio file</chunkify-uploader-heading>
        <chunkify-uploader-file-select>Select a file</chunkify-uploader-file-select>
        <chunkify-uploader-progress-text></chunkify-uploader-progress-text>
        <chunkify-uploader-progress-bar></chunkify-uploader-progress-bar>
        <chunkify-uploader-error>Upload failed. Please try again.</chunkify-uploader-error>
        <chunkify-uploader-retry>Retry</chunkify-uploader-retry>
        <chunkify-uploader-success>Upload complete!</chunkify-uploader-success>
    </chunkify-uploader>
    <pre id="logs"></pre>
    <script type="module">
        import './dist/chunkify-uploader.mjs';
        const uploader = document.querySelector('chunkify-uploader');
        uploader.upload = async (file) => {
            const response = await fetch('/api/uploads', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: file.name }),
            });
            const result = await response.json();
            if (!response.ok) {
                const message = result.error?.message || result.error || 'Could not create an upload session.';
                throw Object.assign(new Error(message), { status: response.status });
            }
            return result;
        };
        for (const name of ['file-selected', 'upload-progress', 'upload-success', 'upload-error', 'upload-reset']) {
            uploader.addEventListener(name, (event) => {
                const detail = JSON.stringify(event.detail, (key, value) =>
                    value instanceof File ? { name: value.name, size: value.size, type: value.type } : value,
                    2
                );
                document.querySelector('#logs').textContent += event.detail == null
                    ? `${name}\n\n`
                    : `${name}: ${detail}\n\n`;
            });
        }
    </script>
</body>
</html>
