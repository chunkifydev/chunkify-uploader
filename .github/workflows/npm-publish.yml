# This workflow will build and publish a package to npm when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish to npm

on:
    release:
        types: [created]

jobs:
    publish-npm:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org/
            - name: Check release version
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "${RELEASE_TAG#v}" != "$PACKAGE_VERSION" ]; then
                      echo "::error::Release tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION. Update the package version before creating the release."
                      exit 1
                  fi
            - run: npm ci
            - run: npm run build
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
