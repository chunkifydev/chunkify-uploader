name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'chunkifydev/chunkify-uploader'
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Add RELEASE_PLEASE_TOKEN as a repository secret or grant this repository access to the organization secret before running Release Please."
            exit 1
          fi

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
