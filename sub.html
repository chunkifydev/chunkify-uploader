<!DOCTYPE html>
<html>
<head>
    <style>
        /* User's custom styling */
        chunkify-uploader {
            width: 30%;
            height: 100px;
            margin: 0 auto;
            align-items: center;
            justify-content: center;
            border: 2px dashed #ccc;
            padding: 8px;
            gap: 12px;
  }
        
        chunkify-uploader[error] {
            border-color: #dc3545;
            background: #fff5f5;
        }
        
        chunkify-uploader[success] {
            border-color: #28a745;
            background: #f8fff9;
        }

        chunkify-uploader[dragover] {
            border-color: #007bff;
            background: #e3f2fd;
        }

  
        .my-title {
            font-size: 18px;
            color: #333;
        }
        
        chunkify-uploader-file-select {
            background: #007bff;
            width: 20%;
            color: white;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
           
            text-align: center;
        }
        
        .my-upload-btn:hover {
            background: #0056b3;
        }
        
            
        .my-error {
            color: #dc3545;
            font-weight: bold;
            text-align: center;
        }
        
        chunkify-uploader-retry {
            background: #dc3545;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            width: 20%;
            padding: 8px;
            text-align: center;
            align-self: center;
        }
        
        .my-success {
            color: #28a745;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
        }
        
        .my-file-info {
            color: #666;
            font-size: 16px;
            margin: 10px 0;
            font-style: italic;
            display: none;
        }

        chunkify-uploader[uploading] .my-file-info {
            display: block;
        }

        .my-progress-container {
            display: flex;
            width: 100%;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .my-upload-btn {
            background: #007bff;
            width: 40%;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            align-self: center;
        }
    </style>
</head>
<body>
    <chunkify-uploader id="uploader" endpoint="http://localhost:8787/api/uplossad" drop>
        <chunkify-uploader-heading class="my-title">Drop your file here</chunkify-uploader-heading>
            <chunkify-uploader-file-select>Select File</chunkify-uploader-file-select>
            <chunkify-uploader-progress-bar />
            <chunkify-uploader-progress-text></chunkify-uploader-progress-text>
            <chunkify-uploader-error>Error during upload</chunkify-uploader-error>
            <chunkify-uploader-retry>Reset</chunkify-uploader-retry>
            <chunkify-uploader-success>Upload successful</chunkify-uploader-success>
    </chunkify-uploader>
   

    <script type="module">
        import './dist/chunkify-uploader.mjs';
        
        const uploader = document.getElementById('uploader');

         /* uploader.endpoint = function () {
            return fetch("http://localhost:8787/api/upload").then(res => res.text());
        }; */
        
        // Set max file size (100MB)
        //uploader.maxFileSize = 1000;
        
        // Listen to events
        /* uploader.addEventListener('file-selected', (e) => {
            console.log('File selected:', e.detail.fileName, e.detail.fileSize);
        }); */
        
        uploader.addEventListener('upload-progress', (e) => {
            const percent = e.detail.progress;
            console.log('Progress:', percent + '%');
            
        });
        
        /* uploader.addEventListener('upload-success', (e) => {
            console.log('Upload successful!', e.detail.fileName);
        }); */
        
        uploader.addEventListener('upload-error', (e) => {
            console.error('Upload error:', e.detail.error + ', status code: ' + e.detail.status);
            const errorMsg = document.querySelector('chunkify-uploader-error');
          // if (e.detail.status !== undefined) {errorText.textContent = e.detail.status;}
          if (e.detail.status === 404) {errorMsg.textContent = "Upload URL not found";}
          if (e.detail.status === 0) {errorMsg.textContent = "Network error during upload";}
            
        });

         /* uploader.onUploadError = (e) => {
            console.error('From shortcut :Upload error:', e.detail.error + ', status code: ' + e.detail.status);
        } */

       /*  uploader.onFileSelected = (e) => {
            const fileInfo = document.getElementById('file-info');
            const sizeInMB = (e.detail.file.size / (1024 * 1024)).toFixed(2);
            fileInfo.textContent = `Uploading: ${e.detail.file.name} (${sizeInMB} MB)`;
        } */

        uploader.onUploadSuccess = (e) => {
            const success = document.querySelector('chunkify-uploader-success');
            success.textContent = `Upload successful for ${e.detail.file.name}`;
        }

        console.log('onUploadError assigned:', !!uploader.onUploadError);
    </script>
</body>
</html>
